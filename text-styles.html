<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Styles</title>
</head>
<style>
    p{
        margin: 0px;
    }
    .font-name{
        font-family: Tahoma;
        font-size: 18px;
        font-weight: bold;
        margin-bottom:20px;
    }
    .deals-head{
        font-family: Arial;
        font-size: 20px;
        font-weight: bold;
        margin-bottom:1px;
    }
    .deals-suf{
        font-family: arial;
        color:red;
        font-style: italic;
        font-size:14px;
    }

</style>
<body>
    <p class="font-name">This is Tahoma font</p>

    <p class="deals-head">Biggest Deals of the Year&excl;</p>
    <p class="deals-suf">Sales end Tuesday</p>
</body>
</html>
