<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Styles</title>
</head>
<style>
    p{
        margin: 0px;
    }
    .font-name{
        font-family: Tahoma;
        font-size: 18px;
        font-weight: bold;
        margin-bottom:20px;
    }
    .deals-head{
        font-family: Arial;
        font-size: 20px;
        font-weight: bold;
        margin-bottom:1px;
    }
    .deals-suf{
        font-family: arial;
        color:red;
        font-style: italic;
        font-size:14px;
        margin-bottom:  20px;
    }

    .course-name{
        font-family: verdana;
        font-weight:bold;
        font-size:12px;
        line-height: 20px;
    }
    .course-level{
        font-family:verdana;
        color:rgb(96,96,96);
        font-size: 11px;
    }
    .intro{
        font-family:verdana;
        font-size:12px;
        width: 220px;
        margin-top: 14px;
    }
    .begin-btn{
        font-family:verdana;
        margin-top:14px;
        padding:4px 8
    }
</style>
<body>
    <p class="font-name">This is Tahoma font</p>

    <p class="deals-head">Biggest Deals of the Year&excl;</p>
    <p class="deals-suf">Sales end Tuesday</p>

    <p class="course-name"> HTML CSS Course</p>
    <p class="course-level">Beginner to Pro</p>
    <p class="intro">In this course, we'll learn the skills 
        you need to become a developer.</p>
    <button class="begin-btn"> Get Started</button>
</body>
</html>
