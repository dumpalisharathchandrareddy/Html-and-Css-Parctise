<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharath</title>
</head>

<style>
    div{
        margin:10px;
    }
    .sub-button{
        background-color: rgb(202, 0, 0);
        height:40px;
        width: 105px;
        border:None;
        color:white;
        border-radius: 2px;
        cursor: pointer;

    }
    .join-button{
        background-color: white;
        color: rgb(64, 163, 255);
        height:40px;
        width: 60px;
        border-style: solid;
        border-width: 1px;
        border-radius: 2px;
        border-color:rgb(64, 163, 255) ;
        cursor: pointer;
        margin: 0px 10px;
    }
    .tweet-button{
        color:white;
        font-weight: bold;
        background-color: rgb(56, 149, 230);
        height:40px;
        width: 80px;
        border: None;
        border-radius: 20px;
        font-size: 15px;
        cursor: pointer;
    }
    .request-now-button{
        background-color: black;
        color:white;
        border:None;
        height:40px;
        width:120px;
        border-radius:2px;
    }

    .add-to-cart-button{
        background-color: rgb(255, 216,20);
        height: 40px;
        width: 200px;
        border: None;
        border-radius: 20px;
        font-size: 15px;
    }
    .signup-button{
        background-color: rgb(46, 164, 79);
        color: white;
        height: 40px;
        border: None;
        width: 95px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 15px;
    }


</style>
<body>
    <div class="twitter">
        <button class="sub-button">SUBSCRIBE</button>
        <button class="join-button"> JOIN </button>
        <button class="tweet-button">Tweet</button>
    </div>

    <div class="uber">
        <button class="request-now-button">
            Request now
        </button>
    </div>

    <div class="amazon">
        <button class="add-to-cart-button">
            Add to Cart
        </button>
    </div>

    <div class="github">    
        <button class="signup-button">
            Sign up
        </button>
    </div>

    <div class="bootstrap">
        <button class="getstarted-button">Get Started</button>
        <button class="download">Download</button>
    </div>

    <div class="linkedin">
        <button>Apply on company website</button>
        <button>Save</button>

    </div>




    
</body>
</html>
